<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>不要扫来历不明的二维码</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #fff;
    position: relative;
  }
  .poster {
    position: fixed; inset: 0;
    background-image: url("https://aka.doubaocdn.com/s/vKiQoakhSh");
    background-size: cover;
    background-position: center top;
  }
  .poster::before {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(180deg,
      rgba(10,14,26,.85) 0%,
      rgba(10,14,26,.35) 22%,
      rgba(10,14,26,0) 45%,
      rgba(10,14,26,0) 60%,
      rgba(10,14,26,.55) 82%,
      rgba(10,14,26,.92) 100%);
  }
  .topbar { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #c8102e, #ff3b30, #c8102e); }
  .masthead { position: absolute; top: 28px; left: 24px; right: 24px; display: flex; align-items: center; gap: 10px; z-index: 2; }
  .shield { width: 26px; height: 26px; flex-shrink: 0; }
  .masthead .org { font-size: 12px; letter-spacing: 3px; color: rgba(255,255,255,.7); }
  .masthead .org b { color: #ff4d4d; font-weight: 600; }
  .headline { position: absolute; top: 70px; left: 24px; right: 24px; z-index: 2; }
  .headline h1 { font-size: 44px; line-height: 1.12; font-weight: 900; letter-spacing: 2px; text-shadow: 0 4px 20px rgba(0,0,0,.5); }
  .headline h1 .red { color: #ff3b30; display: block; }
  .headline h1 .white { display: block; }
  .headline .rule { width: 56px; height: 4px; background: #ff3b30; margin-top: 18px; }
  .bottom { position: absolute; bottom: 0; left: 0; right: 0; padding: 24px 24px 32px; z-index: 2; }
  .from { font-size: 14px; color: rgba(255,255,255,.85); margin-bottom: 14px; letter-spacing: 1px; }
  .from b { color: #fff; font-weight: 600; }
  .easter { font-size: 13px; color: #ffd34d; line-height: 1.6; margin-bottom: 18px; padding-left: 12px; border-left: 2px solid #ffd34d; }
  .slogans { display: flex; border-top: 1px solid rgba(255,255,255,.2); padding-top: 14px; }
  .slogans div { flex: 1; text-align: center; font-size: 11px; color: rgba(255,255,255,.6); letter-spacing: 1px; }
  .slogans div + div { border-left: 1px solid rgba(255,255,255,.2); }
  .slogans div b { display: block; font-size: 14px; color: #fff; font-weight: 600; margin-bottom: 2px; letter-spacing: 2px; }
</style>
</head>
<body>
  <div class="poster"></div>
  <div class="topbar"></div>
  <div class="masthead">
    <svg class="shield" viewBox="0 0 24 24" fill="none">
      <path d="M12 2L4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3z" fill="#c8102e"/>
      <path d="M9 12l2 2 4-4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="org"><b>反诈预警</b> · ANTI-FRAUD ALERT</div>
  </div>
  <div class="headline">
    <h1>
      <span class="red">不要扫！</span>
      <span class="white">来历不明的二维码</span>
    </h1>
    <div class="rule"></div>
  </div>
  <div class="bottom">
    <p class="from">为了您的安全，<b>软件学院科协</b> 提醒您</p>
    <div class="easter">你刚才扫的这个码，就是最好的反诈教材。</div>
    <div class="slogans">
      <div><b>不贪</b>小便宜</div>
      <div><b>不扫</b>陌生码</div>
      <div><b>转账</b>多核实</div>
    </div>
  </div>
</body>
</html>
